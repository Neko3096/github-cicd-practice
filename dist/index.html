<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD 课堂练习 · 静态站点</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 10%, #1b3a5c, #070d16 60%);
      color: #e6eef8;
      font: 16px/1.75 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    main {
      width: min(680px, 100%);
      padding: 38px 40px 32px;
      border: 1px solid #2b4a68;
      border-radius: 16px;
      background: #0d1826cc;
      backdrop-filter: blur(6px);
    }

    .tag {
      display: inline-block;
      margin: 0 0 14px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #123a5b;
      color: #7fd3ff;
      font: 600 12px/1.6 Consolas, monospace;
      letter-spacing: .06em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -.02em;
    }

    .meta {
      margin: 0 0 22px;
      color: #8fa8bf;
      font-size: 14px;
    }

    dl {
      display: grid;
      grid-template-columns: 8em 1fr;
      gap: 10px 16px;
      margin: 0;
      padding-top: 20px;
      border-top: 1px solid #23405a;
      font-size: 15px;
    }

    dt { color: #8fa8bf; }

    dd {
      margin: 0;
      word-break: break-all;
    }

    code {
      padding: 2px 7px;
      border-radius: 5px;
      background: #142c42;
      color: #7fd3ff;
      font-family: Consolas, monospace;
      font-size: 14px;
    }

    .note {
      margin: 22px 0 0;
      padding: 12px 14px;
      border-left: 3px solid #3f8fc0;
      background: #0f2233;
      color: #a8c4d8;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <main>
    <p class="tag">GitHub Actions · GitHub Pages</p>
    <h1>我的 CI/CD 演示站点</h1>
    <p class="meta">作者：洪静香（2024210402054）</p>

    <dl>
      <dt>版本标记</dt>
      <dd><code id="marker">v1</code>　← 每次只改这里，就能验证自动发布</dd>
      <dt>页面打开时间</dt>
      <dd><time id="opened-at">加载脚本中…</time></dd>
      <dt>页面地址</dt>
      <dd><code id="page-url"></code></dd>
    </dl>

    <p class="note">
      页面打开时间是浏览器渲染的时刻，<strong>不是</strong>构建时间或部署时间；
      判断这一版什么时候上线，请到仓库的 Actions 运行记录里核对。
    </p>
  </main>

  <script>
    const now = new Date()
    const openedAt = document.getElementById('opened-at')
    openedAt.dateTime = now.toISOString()
    openedAt.textContent = now.toLocaleString('zh-CN', { hour12: false })
    document.getElementById('page-url').textContent = location.href
  </script>
</body>

</html>
